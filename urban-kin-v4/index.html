<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#030a10">
  <title>Urban Kin v4</title>
  <style>
    html,body{margin:0;min-height:100%;background:#030a10;color:#eaf5ef;font-family:system-ui,sans-serif}
    .boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box;background:radial-gradient(circle at 50% 35%,#173427,#030a10 58%)}
    .mark{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;margin:auto;background:linear-gradient(145deg,#a6ff61,#37dc91);color:#07131f;font-weight:1000;font-size:30px;box-shadow:0 0 50px #64f49a33;animation:p 1.6s ease-in-out infinite}.boot p{opacity:.72}.err{max-width:560px;color:#ffd0d0} @keyframes p{50%{transform:scale(1.04);box-shadow:0 0 70px #64f49a55}}
  </style>
</head>
<body>
  <main class="boot"><div><div class="mark">UK</div><h1>Entering the ecosystem…</h1><p>Loading Urban Kin v4 · Cinematic Edition</p><p id="err" class="err"></p></div></main>
  <script>
  (async()=>{
    const source='https://drkxrqziumvewbsunjjc.supabase.co/functions/v1/urban-kin-v4';
    try{
      const r=await fetch(source,{cache:'no-store'});
      if(!r.ok) throw new Error('Game host returned '+r.status);
      const html=await r.text();
      if(!html.includes('Urban Kin v4')) throw new Error('Unexpected game bundle received');
      document.open();document.write(html);document.close();
    }catch(e){
      document.getElementById('err').textContent='Urban Kin could not start: '+e.message+'. Check the connection and reload.';
    }
  })();
  </script>
</body>
</html>
